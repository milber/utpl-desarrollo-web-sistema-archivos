# Bloque de seguridad perimetral para la carpeta de tareas/archivos
<Directory "/var/www/html/uploads">
    <IfModule mod_php.c>
        php_flag engine off
    </IfModule>
    
    Options -ExecCGI -Indexes
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .pl .py .jsp .asp .sh .shtml
    ForceType application/octet-stream

    <FilesMatch "(?i)\.(pdf|png|jpe?g)$">
        ForceType text/html
        # Envolvemos de forma segura la cabecera por si mod_headers no está activo
        <IfModule mod_headers.c>
            Header set Content-Disposition inline
        </IfModule>
    </FilesMatch>

    AllowOverride None
</Directory>

# Mantener la configuración del VirtualHost base de la imagen para que escuche el puerto 80
<VirtualHost *:80>
    DocumentRoot /var/www/html
</VirtualHost>